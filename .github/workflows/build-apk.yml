name: Build APKs

# Runs when you push to main, when you push a tag like v1.0, or when you press "Run workflow".
# Tags (v1.0, v1.1 ...) also publish the APKs on the Releases page so anyone can download them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK parts
        run: sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Lite = Colab mode only. Small and simple, so this one must always work.
      - name: Build Lite APK
        working-directory: android
        run: gradle --no-daemon :app:assembleColabRelease

      # Full = Colab mode + "This phone" mode (MediaPipe). If this one fails the Lite APK is still published.
      - name: Build Full APK
        id: full
        continue-on-error: true
        working-directory: android
        run: gradle --no-daemon :app:assembleFullRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/colab/release/*.apk out/LoRA-Studio-Lite.apk
          if ls android/app/build/outputs/apk/full/release/*.apk >/dev/null 2>&1; then
            cp android/app/build/outputs/apk/full/release/*.apk out/LoRA-Studio-Full.apk
          fi
          ls -la out

      - name: Warn if the Full APK failed
        if: steps.full.outcome == 'failure'
        run: echo "::warning::The Full APK failed to build. The Lite APK was still built. Open the 'Build Full APK' step log to see why."

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk

      - name: Publish on the Releases page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
